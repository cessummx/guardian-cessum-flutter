  <!-- ===== CESSUM: actualizacion automatica de la app ===== -->
  <!-- Detecta cuando hay una version nueva publicada (el service worker cambia
       su huella en cada compilacion) y ofrece actualizar con un toque, sin
       tener que limpiar el service worker manualmente. -->
  <script id="cessum-auto-update">
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var mostrado = false;

    function mostrarAviso() {
      if (mostrado) return;
      mostrado = true;
      var b = document.createElement('div');
      b.id = 'cessum-update-banner';
      b.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);' +
        'z-index:2147483647;background:#B11D29;color:#fff;padding:12px 16px;border-radius:12px;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.28);font-family:Montserrat,Segoe UI,sans-serif;' +
        'font-size:14px;display:flex;align-items:center;gap:14px;max-width:92vw;';
      var t = document.createElement('span');
      t.textContent = 'Hay una version nueva de la app.';
      var btn = document.createElement('button');
      btn.textContent = 'Actualizar';
      btn.style.cssText = 'background:#fff;color:#B11D29;border:none;border-radius:8px;' +
        'padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px;';
      btn.onclick = forzarActualizacion;
      b.appendChild(t);
      b.appendChild(btn);
      document.body.appendChild(b);
    }

    async function forzarActualizacion() {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) { try { await regs[i].unregister(); } catch (e) {} }
        if (window.caches) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) { try { await caches.delete(keys[j]); } catch (e) {} }
        }
      } catch (e) {}
      location.reload();
    }

    navigator.serviceWorker.ready.then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) mostrarAviso();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) mostrarAviso();
        });
      });
      // Revisa cada 60 s si se publico una version nueva.
      setInterval(function () { try { reg.update(); } catch (e) {} }, 60000);
    }).catch(function () {});

    // Cuando el nuevo service worker toma control, recarga una sola vez.
    var recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recargando) return;
      recargando = true;
      location.reload();
    });
  })();
  </script>
